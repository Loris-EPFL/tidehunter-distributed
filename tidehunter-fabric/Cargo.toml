[package]
name = "tidehunter-fabric"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[features]
default = []
native = ["dep:ofi-libfabric-sys", "dep:libc"]

[dependencies]
# Official generated ABI and inline dispatch wrappers; no handwritten provider ABI.
ofi-libfabric-sys = { version = "=0.2.0", optional = true }
libc = { workspace = true, optional = true }
serde = { version = "1.0.208", features = ["derive"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "deny"
pedantic = "deny"
