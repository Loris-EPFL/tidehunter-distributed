[package]
name = "tidehunter"
version = "0.1.0"
edition = "2024"

[dependencies]
tidehunter-fabric = { path = "../tidehunter-fabric", optional = true, features = ["native"] }
arc-swap = "1.6.0"
memmap2 = "0.7.0"
minibytes = { path = "../third-party/minibytes", default-features = false, features = ["frommmap", "frombytes"] }
smallvec = { version = "1.13.2", features = ["serde"] }
parking_lot = { workspace = true, features = ["arc_lock"] }
crc32fast = "1.3.2"
bytes = {workspace = true}
bincode = "1.3.3"
serde = { version = "1.0.208", features = ["derive"] }
serde_yaml = "0.9.21"
# The existing locked serializer is used only for opt-in fabric diagnostic output.
serde_json = { version = "1.0.140", optional = true }
rand = {workspace = true}
prometheus = {workspace = true}
tokio = { version = "1.36.0", features = ["full"], optional = true}
fastbloom = "0.17"
lru = "0.12.2"
blake2 = { version = "0.10.6" }
blake2b_simd = { version = "1.0.2", optional = true }
rustls = { version = "=0.23.31", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rayon = "1.5.3"
libc = {workspace = true}
typenum = "1.16.0"
strum = { version = "0.26", features = ["derive"] }
lz4_flex = { version = "0.12", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reviewed low-level boundary: pinned buffers/files live through CQ retirement.
# MIT OR Apache-2.0; tokio-rs/io-uring v0.7.14 (ba9149010ccda85bcdf28623d9268b10dd353a93).
io-uring = { version = "=0.7.14", optional = true }

[dev-dependencies]
tempdir = "0.3.7"
hex-literal = "1.0.0"
parking_lot = {workspace = true, features = ["arc_lock"]}
hex = "0.4.3"
criterion = { version = "0.5", features = ["html_reports"] }
# Benchmark JSONL uses the same vetted version without adding a native runtime edge.
serde_json = "1.0.140"

[features]
experimental-fabric = ["experimental-distributed", "dep:tidehunter-fabric", "dep:serde_json"]
experimental-distributed = ["dep:blake2b_simd", "dep:rustls", "dep:io-uring"]
tokio = ["dep:tokio"]
test_methods = []
test-utils = []

[[example]]
name = "sharded_wal_local"
required-features = ["experimental-distributed"]

[[example]]
name = "sharded_wal_bench"
required-features = ["experimental-distributed"]

[[example]]
name = "sharded_wal_recovery_bench"
required-features = ["experimental-distributed"]

[[example]]
name = "sharded_wal_cluster_check"
required-features = ["experimental-distributed", "test-utils"]

[[example]]
name = "sharded_wal_transport_bench"
required-features = ["experimental-distributed", "test-utils"]

[[example]]
name = "sharded_wal_adapter_bench"
required-features = ["experimental-distributed", "test-utils"]

[[example]]
name = "sharded_wal_lifecycle_check"
required-features = ["experimental-distributed", "test-utils"]

[[example]]
name = "sharded_wal_codec_probe"
required-features = ["experimental-distributed"]

[[bench]]
name = "large_table_benchmarks"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "wal_allocator_benchmarks"
harness = false

[[bench]]
name = "index_iter_benchmarks"
harness = false
required-features = ["test-utils"]

[[bench]]
name = "index_insert_benchmarks"
harness = false
required-features = ["test-utils"]

[lints.clippy]
len_without_is_empty = "allow"
