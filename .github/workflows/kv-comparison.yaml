name: Local KV adapter qualification

on:
  push:
    branches: [feat/nvmeof-only]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      backends:
        description: "Comma-separated nonempty subset of tracked backend IDs; blank uses ci.json"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: local-kv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'

jobs:
  qualification:
    runs-on: ubuntu-24.04
    # Backstop above the sum of the step caps (73 minutes); the steps bound
    # each phase, so a slow runner names the phase instead of the job.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: '1.90'

      - name: Resolve native package versions
        id: native-packages
        # The index fetch is the only network use on a warm run. Its helper
        # retries twice, falls back to the upstream archive mirror once, and
        # bounds both attempts, so a stalled mirror cannot take the step.
        timeout-minutes: 6
        run: bash .github/scripts/install_ci_native.sh resolve
      - name: Restore cached native package archives
        id: native-archive-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}
      - name: Record actual shared-host resources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kv-results"
          {
            uname -a
            lscpu
            cat /proc/meminfo
            df -B1 "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
            findmnt -T "$GITHUB_WORKSPACE"
            cat /proc/self/status
            for limit in /sys/fs/cgroup/{cpu.max,memory.max,memory.swap.max}; do
              if [ -f "$limit" ]; then printf '%s: ' "$limit"; cat "$limit"; fi
            done
          } > "$RUNNER_TEMP/kv-results/host-resources.txt"
      - name: Prepare explicit native build prerequisites
        id: native-install
        # Bounded install: retries twice, then one upstream-mirror retry, all
        # inside the helper's timeouts. The tool probes skip clang, cmake and
        # libclang-dev that the hosted image already ships, which removes the
        # 28.8 MB download that lost the budget in run 44536336265.
        timeout-minutes: 9
        run: bash .github/scripts/install_ci_native.sh install "$RUNNER_TEMP/kv-results"
      - name: Save cached native package archives
        # Only a successful install is cached: a key holds a complete snapshot,
        # so a failed run can never pin a partial set under the final key.
        if: steps.native-install.outcome == 'success' && steps.native-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
      - name: Prepare isolated Python harness dependencies
        timeout-minutes: 5
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/kv-python"
          "$RUNNER_TEMP/kv-python/bin/pip" install --disable-pip-version-check --retries 2 --timeout 30 \
            boto3==1.35.99 PyYAML==6.0.2 matplotlib==3.11.2
          echo "$RUNNER_TEMP/kv-python/bin" >> "$GITHUB_PATH"
      - name: Prepare matching FoundationDB client in owned prefix
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/kv-results"
          python3 experiments/kv-comparison/local.py prepare-fdb --prefix "$RUNNER_TEMP/kv-results/fdb-client"
          echo "FDB_CLIENT_LIB_DIR=$RUNNER_TEMP/kv-results/fdb-client/lib" >> "$GITHUB_ENV"
          echo "FDB_CLIENT_LIB_PATH=$RUNNER_TEMP/kv-results/fdb-client/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/kv-results/fdb-client/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$RUNNER_TEMP/kv-results/fdb-client/lib" >> "$GITHUB_ENV"
      - name: Admission and accounting behavior tests
        run: |
          python3 -m unittest discover -s experiments/kv-comparison -p 'test_*.py'
          python3 -B -m unittest discover -s .github/scripts -p 'test_replay_ci.py'
          python3 -B -m unittest discover -s .github/scripts -p 'test_kernel_layout.py'
      # `adapter-tests` runs the feature-gated crate tests. They are not in this
      # job because `cargo test` overwrites target/debug/kv-research with a
      # binary that has the test features, and rust-lang/cargo#11954 makes that
      # replacement unsafe to predict. The build below must stay the last cargo
      # step before the campaign, so the campaign runs a test-utils binary.
      - name: Build actual external adapters
        timeout-minutes: 15
        # test-utils admits the rootless leased ordinary-file fixture that the
        # `hybrid` manifest ID needs (Linux only; additive for every other adapter).
        run: cargo build --locked -p kv-research --features tikv,cassandra,foundationdb,valkey-tcp,garnet,kvrocks,test-utils
      - name: Check monitoring freshness and metric semantics
        run: python3 -m unittest discover -s experiments/kv-comparison/observability -p 'test_*.py'
      - name: Validate sparse-series Prometheus query semantics
        timeout-minutes: 3
        run: |
          set -euo pipefail
          image="$(python3 -c 'import json; print(json.load(open("experiments/kv-comparison/observability/images.lock.json"))["images"]["prom/prometheus"]["image"])')"
          docker run --rm --pull=missing --network none \
            --volume "$PWD/experiments/kv-comparison/observability:/rules:ro" \
            --entrypoint /bin/promtool "$image" test rules /rules/rate-regressions.yaml
      - name: Exercise actual servers and monitoring sequentially (not latency or HA evidence)
        # 9m49s baseline; 12m32s under runner contention. The cap bounds a stuck
        # backend without cutting a complete campaign.
        timeout-minutes: 25
        env:
          SELECTED_BACKENDS: ${{ inputs.backends || '' }}
        run: |
          set -euo pipefail
          backend_args=()
          if [ -n "$SELECTED_BACKENDS" ]; then
            backend_args+=(--backends "$SELECTED_BACKENDS")
          fi
          python3 experiments/kv-comparison/campaign.py \
            --manifest experiments/kv-comparison/ci.json \
            --binary target/debug/kv-research --qualification --observe --mainnet-replay-resp \
            "${backend_args[@]}" --output "$RUNNER_TEMP/kv-results/selected"
          python3 experiments/kv-comparison/observability/stack.py verify \
            --output "$RUNNER_TEMP/kv-results/selected-monitoring.json"
      - name: Export failures and clean exact-owned databases and observer even if either fails
        if: always()
        timeout-minutes: 5
        run: |
          set +e
          database_status=0
          observer_status=0
          python3 experiments/kv-comparison/cleanup.py --root "$RUNNER_TEMP/kv-results" || database_status=$?
          python3 experiments/kv-comparison/observability/stack.py stop || observer_status=$?
          if [ "$database_status" -ne 0 ] || [ "$observer_status" -ne 0 ]; then
            echo "Exact-owned cleanup failed: databases=$database_status observer=$observer_status" >&2
            exit 1
          fi
      - name: Retain raw qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-kv-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kv-results/
            !${{ runner.temp }}/kv-results/fdb-client/lib/**
          if-no-files-found: error
          retention-days: 7

  adapter-tests:
    # The feature-gated crate tests split by live test name: two shards keep the
    # 12m20s test block off one step budget. Each shard lists the binary's own
    # names, so a new test is assigned without a workflow change, and the run
    # fails if fewer tests execute than the shard selected.
    name: Adapter feature tests shard ${{ matrix.index }} of ${{ matrix.shards }}
    runs-on: ubuntu-24.04
    # Backstop above the sum of the step caps (45 minutes).
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 0
            shards: 2
          - index: 1
            shards: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: '1.90'
      - name: Resolve native package versions
        id: native-packages
        timeout-minutes: 6
        run: bash .github/scripts/install_ci_native.sh resolve
      - name: Restore cached native package archives
        id: native-archive-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
          # This job starts cold once; `apt` ignores an archive whose version
          # does not match the candidate it needs.
          restore-keys: ubuntu-24.04-apt-qualification-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}
      - name: Prepare explicit native build prerequisites
        id: native-install
        timeout-minutes: 9
        run: bash .github/scripts/install_ci_native.sh install "$RUNNER_TEMP/adapter-native"
      - name: Save cached native package archives
        if: steps.native-install.outcome == 'success' && steps.native-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
      - name: Prepare matching FoundationDB client in owned prefix
        timeout-minutes: 5
        run: |
          python3 experiments/kv-comparison/local.py prepare-fdb --prefix "$RUNNER_TEMP/adapter-fdb"
          echo "FDB_CLIENT_LIB_DIR=$RUNNER_TEMP/adapter-fdb/lib" >> "$GITHUB_ENV"
          echo "FDB_CLIENT_LIB_PATH=$RUNNER_TEMP/adapter-fdb/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/adapter-fdb/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$RUNNER_TEMP/adapter-fdb/lib" >> "$GITHUB_ENV"
      - name: Test the comparison crate with actual adapter features
        # 12m20s of tests plus a 2m22s cold build in one run; the shard halving
        # leaves the cap at about 2x the observed shard time.
        timeout-minutes: 25
        run: |
          python3 -B .github/scripts/shard_tests.py \
            --index "${{ matrix.index }}" --shards "${{ matrix.shards }}" \
            -- --locked -p kv-research \
            --features tikv,cassandra,foundationdb,valkey-tcp,garnet,kvrocks

  replay-stores:
    # Separate setup/build budget; each qualifier finishes cleanup before the next starts.
    name: Fresh-lifecycle TiKV CQL FDB and libvalkey TCP replay
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: '1.90'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}

      - name: Resolve native package versions
        id: native-packages
        # This job timed out twice on a slow 28.8 MB libclang-18-dev download
        # (run 44536336265, attempts 1-2). The helper retries twice, falls back
        # to the upstream archive mirror once and bounds both attempts.
        timeout-minutes: 6
        run: bash .github/scripts/install_ci_native.sh resolve
      - name: Restore cached native package archives
        id: native-archive-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
      - name: Prepare native dependencies
        id: native-install
        # Bounded install with two retries and one upstream-mirror retry. The
        # tool probes skip clang, cmake and libclang-dev that the hosted image
        # already provides, which removes the download that failed twice.
        timeout-minutes: 9
        run: bash .github/scripts/install_ci_native.sh install "$RUNNER_TEMP/replay-stores" rdma
      - name: Save cached native package archives
        # Only a successful install is cached: a key holds a complete snapshot,
        # so a failed run can never pin a partial set under the final key.
        if: steps.native-install.outcome == 'success' && steps.native-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
      - name: Prepare isolated Python harness dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/replay-python"
          "$RUNNER_TEMP/replay-python/bin/pip" install --disable-pip-version-check --retries 2 --timeout 30 \
            boto3==1.35.99 PyYAML==6.0.2
          echo "$RUNNER_TEMP/replay-python/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned FDB client and paired Valkey source
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 experiments/kv-comparison/local.py prepare-fdb --prefix "$RUNNER_TEMP/replay-fdb"
          python3 experiments/kv-comparison/prepare_valkey_rdma.py --output "$RUNNER_TEMP/replay-valkey"
          echo "FDB_CLIENT_LIB_DIR=$RUNNER_TEMP/replay-fdb/lib" >> "$GITHUB_ENV"
          echo "FDB_CLIENT_LIB_PATH=$RUNNER_TEMP/replay-fdb/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/replay-fdb/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$RUNNER_TEMP/replay-fdb/lib" >> "$GITHUB_ENV"
          echo "VALKEY_SOURCE_DIR=$RUNNER_TEMP/replay-valkey" >> "$GITHUB_ENV"
      - name: Build replay binary and real FDB regression executable
        timeout-minutes: 25
        run: |
          set -euo pipefail
          features=tikv,cassandra,foundationdb,valkey-tcp,valkey-rdma
          cargo build --locked -p kv-research --bin kv-research --features "$features"
          cargo test --locked -p kv-research --lib --no-run --features "$features" --message-format=json \
            > "$RUNNER_TEMP/replay-stores/test-build.jsonl"
      - name: Test sequential qualifier driver
        timeout-minutes: 1
        run: python3 -B -m unittest discover -s .github/scripts -p test_replay_stores_ci.py
      - name: Qualify fresh owned servers sequentially (RDMA not executed)
        timeout-minutes: 25
        run: |
          python3 -B .github/scripts/replay_stores_ci.py --binary target/debug/kv-research \
            --test-messages "$RUNNER_TEMP/replay-stores/test-build.jsonl" \
            --output "$RUNNER_TEMP/replay-stores/runs"
      - name: Export failures and clean exact-owned servers
        if: always()
        timeout-minutes: 5
        run: python3 experiments/kv-comparison/cleanup.py --root "$RUNNER_TEMP/replay-stores"
      - name: Retain replay and failure receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-stores-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/replay-stores/
          if-no-files-found: error
          retention-days: 7

  lint-backends:
    # Clippy `-D warnings` for every feature-gated kv-research backend. No hardware
    # runs: valkey-rdma only compiles against rdma-core headers and the pinned libvalkey.
    name: Lint feature-gated backends
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: '1.90'
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}
      - name: Resolve native package versions
        id: native-packages
        # Same cache and helper as the qualification job: two retries, one
        # upstream-mirror fallback and a bound on each attempt.
        timeout-minutes: 6
        run: bash .github/scripts/install_ci_native.sh resolve
      - name: Restore cached native package archives
        id: native-archive-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
          # `github.job` keeps this job's key separate, so its first run starts
          # cold. Fall back to the qualification snapshot; apt ignores an archive
          # whose version does not match the candidate it needs.
          restore-keys: ubuntu-24.04-apt-qualification-
      - name: Install build packages
        id: native-install
        timeout-minutes: 9
        # Packages follow the replay-stores job; libibverbs-dev and librdmacm-dev
        # provide the rdma-core headers that libvalkey_rdma and the shim include.
        # The restored archives still serve a warm install; a cold one retries.
        run: bash .github/scripts/install_ci_native.sh install "$RUNNER_TEMP/lint-native" rdma
      - name: Save cached native package archives
        # Only a successful install is cached: a key holds a complete snapshot,
        # so a failed run can never pin a partial set under the final key.
        if: steps.native-install.outcome == 'success' && steps.native-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ubuntu-24.04-apt-${{ github.job }}-${{ steps.native-packages.outputs.key }}
      - name: Prepare isolated Python dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -m venv --system-site-packages "$RUNNER_TEMP/lint-python"
          "$RUNNER_TEMP/lint-python/bin/pip" install --disable-pip-version-check --retries 2 --timeout 30 \
            boto3==1.35.99 PyYAML==6.0.2
          echo "$RUNNER_TEMP/lint-python/bin" >> "$GITHUB_PATH"
      - name: Prepare pinned FDB client and paired Valkey source
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 experiments/kv-comparison/local.py prepare-fdb --prefix "$RUNNER_TEMP/lint-fdb"
          python3 experiments/kv-comparison/prepare_valkey_rdma.py --output "$RUNNER_TEMP/lint-valkey"
          echo "FDB_CLIENT_LIB_DIR=$RUNNER_TEMP/lint-fdb/lib" >> "$GITHUB_ENV"
          echo "FDB_CLIENT_LIB_PATH=$RUNNER_TEMP/lint-fdb/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/lint-fdb/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$RUNNER_TEMP/lint-fdb/lib" >> "$GITHUB_ENV"
          echo "VALKEY_SOURCE_DIR=$RUNNER_TEMP/lint-valkey" >> "$GITHUB_ENV"
      - name: Fetch locked dependencies
        timeout-minutes: 10
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo +1.90 fetch --locked
      - name: Clippy every feature-gated backend
        timeout-minutes: 45
        run: python3 .github/scripts/checks.py lint-backends
