name: Rust Tests

on:
  push:
    branches: ["main", "feat/nvmeof-only"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      tidehunter_repo_ref:
        description: "Branch / commit to test"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"
  # Keep panic diagnostics visible if a detached worker aborts libtest.
  RUST_TEST_NOCAPTURE: "1"

jobs:
  mainnet-fixture:
    name: Mainnet fixture tests
    runs-on: ubuntu-24.04
    # The small serializer oracle needs no Sui build or archive download.
    # Allow cold Cargo setup plus the bounded tests and cache save.
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/experiments/sui-mainnet/serializer-reference/target
      RUSTUP_TOOLCHAIN: "1.90"
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tidehunter_repo_ref || github.sha }}
          persist-credentials: false

      - name: Verify retained mainnet fixture hashes
        # Fail before dependency installation/build if any committed byte changed.
        timeout-minutes: 1
        run: |
          python3 -B - <<'PY'
          import pathlib
          import sys
          sys.path.insert(0, "experiments/sui-mainnet")
          import trace_format as tf
          root = pathlib.Path("experiments/sui-mainnet/fixture")
          manifest = tf.admit(root, "4264e79e0cbe4a1e36d94468df2f049f988eac57877c9bf2e7e175489dc922fa")
          print(f"Verified SHA-256 and size of all {len(manifest['files'])} retained fixture files")
          PY

      - name: Set up repository Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"

      - name: Cache serializer Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-serializer-deps-${{ hashFiles('experiments/sui-mainnet/serializer-reference/Cargo.lock') }}

      - name: Cache serializer build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: experiments/sui-mainnet/serializer-reference/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-serializer-${{ hashFiles('experiments/sui-mainnet/serializer-reference/Cargo.lock') }}-${{ hashFiles('experiments/sui-mainnet/serializer-reference/src/**/*.rs', 'experiments/sui-mainnet/serializer-reference/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-serializer-${{ hashFiles('experiments/sui-mainnet/serializer-reference/Cargo.lock') }}-

      - name: Install checkpoint decompressor
        # Bound package-mirror stalls; no Sui archive is downloaded.
        timeout-minutes: 2
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends zstd

      - name: Build independent serializer reference
        # Cold compilation is only serde, JSON, BCS and bincode, not the workspace.
        timeout-minutes: 3
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo +1.90 build --locked --manifest-path experiments/sui-mainnet/serializer-reference/Cargo.toml

      - name: Test deterministic mainnet fixture and Rust serializer agreement
        # Each Rust cross-check has its own 180-second subprocess bound.
        timeout-minutes: 4
        run: python3 -B -m unittest discover -s experiments/sui-mainnet -p 'test_*.py' -v

  mainnet-replay:
    name: Mainnet replay
    needs: mainnet-fixture
    runs-on: ubuntu-24.04
    # Bound cold native compilation, correctness, informational replay and upload.
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/mainnet-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tidehunter_repo_ref || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"

      - name: Cache native Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}

      - name: Cache native replay build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mainnet-replay
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-native-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-native-${{ hashFiles('Cargo.lock') }}-

      - name: Build native replay only
        # Seven minutes covers cold registry access and native release compilation;
        # the remaining eight minutes cover cache/setup, replay and evidence upload.
        timeout-minutes: 7
        run: cargo +1.90 build --locked --release -p kv-research --bin kv-research --no-default-features

      - name: Check exact replay counts and full returned bytes
        # 60-second case deadline + 5-second shutdown grace; 90-second supervisor
        # also bounds admission/preload, leaving time to export errors at 2 minutes.
        timeout-minutes: 2
        run: |
          python3 -B .github/scripts/mainnet_replay_ci.py correctness \
            --binary "$CARGO_TARGET_DIR/release/kv-research" \
            --output "$RUNNER_TEMP/mainnet-replay/correctness"

      - name: Informational finite replay (not sustained/30 s, not decision data)
        continue-on-error: true
        # 120-second case deadline + 10-second grace; 180-second supervisor also
        # bounds cold admission/preload. No performance value gates correctness.
        timeout-minutes: 4
        # R=512/native_default keeps production table shapes and geometry checks.
        # Measured admission: 1,702,560,768 B disk (1.586 GiB) and 473,329,664 B
        # RAM (0.441 GiB), within ~14-GB disk/16-GB RAM runner resources.
        # Disk model: empirical 2x key/value payload + six open WAL fragments;
        # not a universal amplification bound. Runtime checks actual free space.
        run: |
          python3 -B .github/scripts/mainnet_replay_ci.py benchmark \
            --binary "$CARGO_TARGET_DIR/release/kv-research" \
            --output "$RUNNER_TEMP/mainnet-replay/benchmark"

      - name: Retain replay summaries and diagnostics
        if: always()
        # Bound artifact transfer; never upload database/WAL files or raw CSV.
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainnet-replay/**/ci-summary.json
            ${{ runner.temp }}/mainnet-replay/**/config.json
            ${{ runner.temp }}/mainnet-replay/**/run.log
            ${{ runner.temp }}/mainnet-replay/**/result/summary.json
            ${{ runner.temp }}/mainnet-replay/**/result/manifest.json
            ${{ runner.temp }}/mainnet-replay/**/result/panic.txt
          if-no-files-found: warn
          retention-days: 7

  nvme-tcp-loopback:
    name: Kernel NVMe/TCP recovery proofs
    runs-on: ubuntu-24.04
    # Cold native build plus bounded single- and four-owner proofs and cleanup.
    timeout-minutes: 47
    env:
      KERNEL_TCP_STATE: /var/lib/tidehunter-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tidehunter_repo_ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}
      - name: Prepare native and kernel TCP prerequisites
        timeout-minutes: 15
        run: |
          set -euo pipefail
          bash .github/scripts/setup.sh core
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y \
            --no-install-recommends nvme-cli python3-yaml python3-boto3 gdb
          for module in nvmet nvmet-tcp nvme-tcp; do
            timeout 10s sudo -n modprobe "$module"
          done
          mountpoint -q /sys/kernel/config || sudo mount -t configfs none /sys/kernel/config
          sudo install -d -m 0700 "$KERNEL_TCP_STATE" "$KERNEL_TCP_STATE/libs"
      - name: Build shared kernel TCP proof binary
        timeout-minutes: 10
        run: cargo +1.90 build --locked --offline -p kv-research --bin kv-research
      - name: Gate single-owner abrupt-crash recovery in both durability tiers
        # CI uses 8 MiB WAL members with 4 MiB fragments, crossing both boundaries.
        # Cloud qualification keeps its 1 GiB members.
        timeout-minutes: 7
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-nvme-tcp"
          df -B1 /var/lib /mnt "$GITHUB_WORKSPACE" | tee "$RUNNER_TEMP/kernel-nvme-tcp/disk-before.txt"
          timeout --signal=TERM --kill-after=25s 390s \
            sudo -n /usr/bin/python3 -B .github/scripts/kernel_nvme_tcp_ci.py qualify \
              --state "$KERNEL_TCP_STATE" --binary target/debug/kv-research \
            2>&1 | tee "$RUNNER_TEMP/kernel-nvme-tcp/single-owner.log"
      - name: Run existing kernel TCP admission and second-open proof (non-gating)
        id: four_owner
        continue-on-error: true
        timeout-minutes: 13
        run: |
          set -euo pipefail
          # TERM becomes an exception inside the maintained proof, so its finally
          # block drains/stops exact-owned controllers, targets, namespaces and units.
          timeout --signal=TERM --kill-after=120s 600s \
            sudo -n /usr/bin/python3 -B .github/scripts/kernel_nvme_tcp_ci.py run \
              --state "$KERNEL_TCP_STATE" --binary target/debug/kv-research \
            2>&1 | tee "$RUNNER_TEMP/kernel-nvme-tcp/run.log"
      - name: Verify exact-owned four-owner cleanup (non-gating)
        if: always() && (steps.four_owner.outcome == 'success' || steps.four_owner.outcome == 'failure' || steps.four_owner.outcome == 'cancelled')
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sudo -n /usr/bin/python3 -B .github/scripts/kernel_nvme_tcp_ci.py cleanup \
            --state "$KERNEL_TCP_STATE" > "$RUNNER_TEMP/kernel-nvme-tcp/cleanup.log" 2>&1
      - name: Export kernel proof evidence even on failure
        if: always()
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-nvme-tcp"
          # Keep receipts and diagnostics, never retained single-owner fixtures or WALs.
          if sudo -n test -d "$KERNEL_TCP_STATE"; then
            sudo -n find "$KERNEL_TCP_STATE" -type d -name 'kernel-live-root-*' -prune -o -type f \
              \( -name '*.json' -o -name '*.log' -o -name '*.txt' -o -name '*.yaml' -o -name '*.prom' \) \
              -exec cp --parents --target-directory "$RUNNER_TEMP/kernel-nvme-tcp" -- '{}' +
          fi
          sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/kernel-nvme-tcp"
          {
            echo "### Kernel NVMe/TCP recovery proofs"
            echo "Kernel: $(uname -r)"
            echo "Single-owner abrupt-crash recovery (gating): both history modes, both tiers."
            if [ -f "$RUNNER_TEMP/kernel-nvme-tcp$KERNEL_TCP_STATE/single-owner/summary.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/kernel-nvme-tcp$KERNEL_TCP_STATE/single-owner/summary.json"
              echo '```'
            else
              echo "No single-owner summary; inspect setup and single-owner logs."
            fi
            echo "Four-owner admission and second-open proof (non-gating)."
            echo "No RDMA, independent SSD, HA or performance qualification."
            if [ -f "$RUNNER_TEMP/kernel-nvme-tcp$KERNEL_TCP_STATE/proof/proof.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/kernel-nvme-tcp$KERNEL_TCP_STATE/proof/proof.json"
              echo '```'
            else
              echo "No four-owner proof receipt; check whether the step started."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain kernel TCP proof and failure diagnostics
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-nvme-tcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kernel-nvme-tcp/
          if-no-files-found: warn
          retention-days: 7

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - profile: format
            name: Format
            setup: core
          - profile: lint
            name: Lint
            setup: core
          - profile: native
            name: Run Tests
            setup: core
          - profile: distributed
            name: Leased Distributed Tests
            setup: core
          - profile: fabric
            name: Leased OFI Tests
            setup: fabric
          - profile: software-fabric
            name: Software OFI Tests
            setup: fabric
          - profile: harness
            name: Harness Tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tidehunter_repo_ref || github.sha }}
          persist-credentials: false

      - name: Set up repository Rust
        if: matrix.profile != 'harness'
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - name: Select isolated software provider prefix
        if: matrix.setup == 'fabric'
        run: echo "TIDEHUNTER_LIBFABRIC_PREFIX=$RUNNER_TEMP/tidehunter-libfabric-2.6.0" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        if: matrix.profile != 'harness'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}

      - name: Cache profile build
        if: matrix.profile != 'format' && matrix.profile != 'harness'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', '.github/scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}-

      - name: Cache pinned software libfabric
        if: matrix.setup == 'fabric'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TIDEHUNTER_LIBFABRIC_PREFIX }}
          key: ${{ runner.os }}-${{ runner.arch }}-libfabric-2.6.0-${{ hashFiles('.github/scripts/setup.sh') }}

      - name: Prepare selected profile
        if: matrix.profile != 'harness'
        run: bash .github/scripts/setup.sh "${{ matrix.setup }}"

      - name: Select Python 3.12 for Harness
        if: matrix.profile == 'harness'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Prepare isolated Python Harness dependencies
        if: matrix.profile == 'harness'
        timeout-minutes: 5
        # The Harness profile runs Python discovery only. Use the same pinned
        # wheels as Local KV, not Ubuntu's matplotlib/SciPy package graph.
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/harness-python"
          python3 -m venv --system-site-packages "$venv"
          if ! "$venv/bin/python" -m pip install --disable-pip-version-check --retries 2 --timeout 30 \
              boto3==1.35.99 PyYAML==6.0.2 matplotlib==3.11.2; then
            echo "::error::Failed to install the pinned Python Harness dependencies"
            exit 1
          fi
          "$venv/bin/python" -c 'import boto3, matplotlib, tomllib, yaml'
          echo "$venv/bin" >> "$GITHUB_PATH"

      # Software providers and deterministic fixtures are correctness checks,
      # not evidence of RDMA hardware activity or network performance.
      - name: Run selected profile
        run: python3 .github/scripts/checks.py "${{ matrix.profile }}"

      - name: Enforce file length and test layout
        if: matrix.profile == 'format'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -B .github/scripts/checks.py file-length
          python3 -B .github/scripts/checks.py test-layout
          python3 -B -m unittest discover -s .github/scripts -p 'test_checks.py' -v

      - name: Prepare Darwin standard library for boundary check
        if: matrix.profile == 'lint'
        run: rustup target add --toolchain 1.90 x86_64-apple-darwin

      - name: Type-check distributed code off Linux (Linux-only code confined to distributed/sys/)
        if: matrix.profile == 'lint'
        env:
          CC_x86_64_apple_darwin: ${{ github.workspace }}/.github/scripts/darwin-check-cc.sh
          AR_x86_64_apple_darwin: ar
          # Do not cache the empty objects in the normal profile build directory.
          CARGO_TARGET_DIR: ${{ runner.temp }}/darwin-boundary-check
        run: cargo +1.90 check --locked --offline -p tidehunter --all-targets --features experimental-distributed --target x86_64-apple-darwin

      - name: Run default adapter suite
        if: matrix.profile == 'native'
        run: cargo +1.90 test --locked --offline -p kv-research --no-default-features
      - name: Gate leased distributed mainnet replay on local files
        if: matrix.profile == 'distributed'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/distributed-mainnet"
          python3 -B .github/scripts/distributed_mainnet_ci.py \
            2>&1 | tee "$RUNNER_TEMP/distributed-mainnet/run.log"

      - name: Retain distributed replay failures
        if: always() && matrix.profile == 'distributed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributed-mainnet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distributed-mainnet/
          if-no-files-found: warn
          retention-days: 7

      - name: Report hardware-only exclusions
        if: always() && (matrix.profile == 'distributed' || matrix.profile == 'fabric')
        run: |
          echo "::notice::Kernel NVMe-oF/RDMA campaigns are excluded: they need an owned nvmet target, initiator modules and RDMA hardware."
          echo "Local-file LiveIo and write_model exercise leased I/O; no kernel target is needed." >> "$GITHUB_STEP_SUMMARY"
