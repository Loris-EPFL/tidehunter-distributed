name: Rust Tests

on:
  push:
    branches: ["main", "feat/sharded-value-wal", "feat/two-vm-remote-read-write", "p8-ci"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      tidehunter_repo_ref:
        description: "Branch / commit to test"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"
  # Keep panic diagnostics visible if a detached worker aborts libtest.
  RUST_TEST_NOCAPTURE: "1"

jobs:
  mainnet-fixture:
    name: Mainnet fixture tests
    runs-on: ubuntu-24.04
    # The small serializer oracle needs no Sui build or archive download.
    # Allow cold Cargo setup plus the bounded tests and cache save.
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/experiments/sui-mainnet/serializer-reference/target
      RUSTUP_TOOLCHAIN: "1.90"
      CARGO_NET_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tidehunter_repo_ref || github.sha }}
          persist-credentials: false

      - name: Verify retained mainnet fixture hashes
        # Fail before dependency installation/build if any committed byte changed.
        timeout-minutes: 1
        run: |
          python3 -B - <<'PY'
          import pathlib
          import sys
          sys.path.insert(0, "experiments/sui-mainnet")
          import trace_format as tf
          root = pathlib.Path("experiments/sui-mainnet/fixture")
          manifest = tf.admit(root, "4264e79e0cbe4a1e36d94468df2f049f988eac57877c9bf2e7e175489dc922fa")
          print(f"Verified SHA-256 and size of all {len(manifest['files'])} retained fixture files")
          PY

      - name: Set up repository Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"

      - name: Cache serializer Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-serializer-deps-${{ hashFiles('experiments/sui-mainnet/serializer-reference/Cargo.lock') }}

      - name: Cache serializer build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: experiments/sui-mainnet/serializer-reference/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-serializer-${{ hashFiles('experiments/sui-mainnet/serializer-reference/Cargo.lock') }}-${{ hashFiles('experiments/sui-mainnet/serializer-reference/src/**/*.rs', 'experiments/sui-mainnet/serializer-reference/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-serializer-${{ hashFiles('experiments/sui-mainnet/serializer-reference/Cargo.lock') }}-

      - name: Install checkpoint decompressor
        # Bound package-mirror stalls; no Sui archive is downloaded.
        timeout-minutes: 2
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends zstd

      - name: Build independent serializer reference
        # Cold compilation is only serde, JSON, BCS and bincode, not the workspace.
        timeout-minutes: 3
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo +1.90 build --locked --manifest-path experiments/sui-mainnet/serializer-reference/Cargo.toml

      - name: Test deterministic mainnet fixture and Rust serializer agreement
        # Each Rust cross-check has its own 180-second subprocess bound.
        timeout-minutes: 4
        run: python3 -B -m unittest discover -s experiments/sui-mainnet -p 'test_*.py' -v

  mainnet-replay:
    name: Mainnet replay
    needs: mainnet-fixture
    runs-on: ubuntu-24.04
    # Bound cold native compilation, correctness, informational replay and upload.
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/mainnet-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tidehunter_repo_ref || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"

      - name: Cache native Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}

      - name: Cache native replay build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/mainnet-replay
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-native-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-mainnet-native-${{ hashFiles('Cargo.lock') }}-

      - name: Build native replay only
        # Seven minutes covers cold registry access and native release compilation;
        # the remaining eight minutes cover cache/setup, replay and evidence upload.
        timeout-minutes: 7
        run: cargo +1.90 build --locked --release -p kv-research --bin kv-research --no-default-features

      - name: Check exact replay counts and full returned bytes
        # 60-second case deadline + 5-second shutdown grace; 90-second supervisor
        # also bounds admission/preload, leaving time to export errors at 2 minutes.
        timeout-minutes: 2
        run: |
          python3 -B .github/scripts/mainnet_replay_ci.py correctness \
            --binary "$CARGO_TARGET_DIR/release/kv-research" \
            --output "$RUNNER_TEMP/mainnet-replay/correctness"

      - name: Informational finite replay (not sustained/30 s, not decision data)
        continue-on-error: true
        # 120-second case deadline + 10-second grace; 180-second supervisor also
        # bounds cold admission/preload. No performance value gates correctness.
        timeout-minutes: 4
        # R=512/native_default keeps production table shapes and geometry checks.
        # Measured admission: 1,702,560,768 B disk (1.586 GiB) and 473,329,664 B
        # RAM (0.441 GiB), within ~14-GB disk/16-GB RAM runner resources.
        # Disk model: empirical 2x key/value payload + six open WAL fragments;
        # not a universal amplification bound. Runtime checks actual free space.
        run: |
          python3 -B .github/scripts/mainnet_replay_ci.py benchmark \
            --binary "$CARGO_TARGET_DIR/release/kv-research" \
            --output "$RUNNER_TEMP/mainnet-replay/benchmark"

      - name: Retain replay summaries and diagnostics
        if: always()
        # Bound artifact transfer; never upload database/WAL files or raw CSV.
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mainnet-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mainnet-replay/**/ci-summary.json
            ${{ runner.temp }}/mainnet-replay/**/config.json
            ${{ runner.temp }}/mainnet-replay/**/run.log
            ${{ runner.temp }}/mainnet-replay/**/result/summary.json
            ${{ runner.temp }}/mainnet-replay/**/result/manifest.json
            ${{ runner.temp }}/mainnet-replay/**/result/panic.txt
          if-no-files-found: warn
          retention-days: 7

  nvme-tcp-module-probe:
    name: Kernel NVMe/TCP module probe (non-gating)
    runs-on: ubuntu-24.04
    continue-on-error: true
    # Only inspect/load three kernel modules; no target, device or workload setup.
    timeout-minutes: 2
    steps:
      - name: Report kernel and module availability
        # Module load attempts need seconds, not an unbounded privileged command.
        timeout-minutes: 1
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### Kernel NVMe/TCP module probe (non-gating)"
            echo
            echo "Kernel: $(uname -r)"
            echo
            echo '```text'
            for module in nvmet nvmet-tcp nvme-tcp; do
              if timeout 10s sudo -n modprobe "$module"; then
                echo "$module: modprobe succeeded"
              else
                echo "$module: modprobe failed (exit $?)"
              fi
              if [ -d "/sys/module/${module//-/_}" ]; then
                echo "$module: present in /sys/module"
              else
                echo "$module: not present in /sys/module"
              fi
            done
            echo '```'
            echo
            echo "Module availability only; no loopback, NVMe/RDMA or performance validation."
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - profile: format
            name: Format
            setup: core
          - profile: lint
            name: Lint
            setup: core
          - profile: native
            name: Run Tests
            setup: core
          - profile: distributed
            name: Distributed Tests
            setup: core
          - profile: fabric
            name: Fabric Tests
            setup: fabric
          - profile: software-fabric
            name: Software Fabric Tests
            setup: fabric
          - profile: harness
            name: Harness Tests
            setup: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tidehunter_repo_ref || github.sha }}
          persist-credentials: false

      - name: Set up repository Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"
          components: rustfmt, clippy

      - name: Select isolated software provider prefix
        if: matrix.setup == 'fabric'
        run: echo "TIDEHUNTER_LIBFABRIC_PREFIX=$RUNNER_TEMP/tidehunter-libfabric-2.6.0" >> "$GITHUB_ENV"

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}

      - name: Cache profile build
        if: matrix.profile != 'format' && matrix.profile != 'harness'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', '.github/scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-${{ matrix.profile }}-${{ hashFiles('Cargo.lock') }}-

      - name: Cache pinned software libfabric
        if: matrix.setup == 'fabric'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TIDEHUNTER_LIBFABRIC_PREFIX }}
          key: ${{ runner.os }}-${{ runner.arch }}-libfabric-2.6.0-${{ hashFiles('.github/scripts/setup.sh') }}

      - name: Prepare selected profile
        env:
          TIDEHUNTER_SETUP_HARNESS_PLOTS: ${{ matrix.profile == 'harness' && '1' || '0' }}
        run: bash .github/scripts/setup.sh "${{ matrix.setup }}"

      # Software providers and deterministic fixtures are correctness checks,
      # not evidence of EFA/RDMA hardware activity or network performance.
      - name: Run selected profile
        run: python3 .github/scripts/checks.py "${{ matrix.profile }}"

      # Keep extra CI coverage out of the shared native/distributed profiles,
      # which are also used within the separately bounded paid cloud campaign.
      - name: Run default adapter suite
        if: matrix.profile == 'native'
        run: cargo +1.90 test --locked --offline -p kv-research

      - name: Run file-backed NVMe engine and adapter suites
        if: matrix.profile == 'distributed'
        # write_model uses local-file LiveIo, not an NVMe-oF kernel target.
        run: |
          cargo +1.90 test --locked --offline -p tidehunter --features experimental-nvmeof,test-utils
          cargo +1.90 test --locked --offline -p kv-research --features nvmeof,test-utils

      - name: Run comparison and deployment harnesses
        if: matrix.profile == 'harness'
        run: |
          for directory in experiments/kv-comparison experiments/kv-comparison/observability experiments/gcp-rdma; do
            python3 -m unittest discover -s "$directory" -p 'test_*.py' -v
          done

      - name: Report hardware-only exclusions
        if: always() && (matrix.profile == 'distributed' || matrix.profile == 'fabric')
        run: |
          echo "::notice::efa_direct_opens_only_the_negotiated_hardware_fabric stays ignored: GitHub-hosted runners have no EFA device."
          echo "::notice::Kernel NVMe-oF/RDMA campaigns are excluded: they need an owned nvmet target, initiator modules and RDMA hardware."
          echo "Local-file LiveIo and write_model run in Distributed Tests and Fabric Tests; no nvme-cli or kernel target is needed." >> "$GITHUB_STEP_SUMMARY"
