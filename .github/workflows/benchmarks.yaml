name: Performance Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: "Native benchmark to run (all, read_window, index, benchmark)"
        type: choice
        options:
          - all
          - read_window
          - index
          - benchmark
        default: "all"
      post_to_slack:
        description: "Post results to Slack"
        type: boolean
        default: false

permissions:
  contents: read

# This heavy manual queue is separate from cancellable correctness workflows.
concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: self-hosted
    environment: benchmarks
    timeout-minutes: 1440 # 24 hours; requires an approved, adequately sized runner.
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      BENCHMARK_TYPE: ${{ inputs.benchmark_type }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare owned run directories
        id: prepare
        run: |
          BENCH_RUN_DIR="$RUNNER_TEMP/tidehunter-benchmarks-${{ github.repository_id }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          BENCH_DATA_DIR="$BENCH_RUN_DIR/data"
          BENCH_RESULTS_DIR="$BENCH_RUN_DIR/results"
          mkdir "$BENCH_RUN_DIR"
          {
            echo "BENCH_RUN_DIR=$BENCH_RUN_DIR"
            echo "BENCH_DATA_DIR=$BENCH_DATA_DIR"
            echo "BENCH_RESULTS_DIR=$BENCH_RESULTS_DIR"
          } >> "$GITHUB_ENV"
          echo "owned=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$BENCH_DATA_DIR/index" "$BENCH_DATA_DIR/general" "$BENCH_DATA_DIR/general-4k" "$BENCH_RESULTS_DIR"
          {
            echo "# Native Benchmark Results - $(date -u)"
            echo "Commit: $GITHUB_SHA"
            echo "Benchmark selection: $BENCHMARK_TYPE"
            echo "## Environment"
            uname -a
            df -h "$BENCH_RUN_DIR"
          } > "$BENCH_RESULTS_DIR/summary.md"

      - name: Set up repository Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}

      - name: Cache native benchmark build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-native-bench-release-default-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', '.github/scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-native-bench-release-default-${{ hashFiles('Cargo.lock') }}-

      - name: Prepare native dependencies
        run: |
          bash .github/scripts/setup.sh core 2>&1 | tee "$BENCH_RESULTS_DIR/setup.txt"
          rustc +1.90 --version >> "$BENCH_RESULTS_DIR/summary.md"

      - name: Build native benchmarks
        run: |
          cargo +1.90 build --locked --release -p index_benchmark -p benchmark -p read_window_test \
            2>&1 | tee "$BENCH_RESULTS_DIR/build.txt"

      - name: Generate index benchmark files
        if: inputs.benchmark_type == 'all' || inputs.benchmark_type == 'index'
        run: |
          cargo +1.90 run --locked --release -p index_benchmark -- generate \
            --num-indices 25000 \
            --entries-per-index 1000000 \
            --header-file "$BENCH_DATA_DIR/index/bench-header-100GB-100K.dat" \
            --uniform-file "$BENCH_DATA_DIR/index/bench-uniform-file-100GB-100K.dat" \
            2>&1 | tee "$BENCH_RESULTS_DIR/index-generation.txt"

      - name: Run index benchmark
        if: inputs.benchmark_type == 'all' || inputs.benchmark_type == 'index'
        run: |
          echo "## Index Benchmark" >> "$BENCH_RESULTS_DIR/summary.md"
          START_TIME=$(date +%s)
          cargo +1.90 run --locked --release -p index_benchmark -- run \
            --num-lookups 100000 \
            --num-runs 1 \
            --batch-size 1000 \
            --window-size 800 \
            --header-file "$BENCH_DATA_DIR/index/bench-header-100GB-100K.dat" \
            --uniform-file "$BENCH_DATA_DIR/index/bench-uniform-file-100GB-100K.dat" \
            2>&1 | tee "$BENCH_RESULTS_DIR/index.txt"
          cat "$BENCH_RESULTS_DIR/index.txt" >> "$BENCH_RESULTS_DIR/summary.md"
          echo "Total time: $(($(date +%s) - START_TIME)) seconds" >> "$BENCH_RESULTS_DIR/summary.md"

      - name: Run read window benchmark
        if: inputs.benchmark_type == 'all' || inputs.benchmark_type == 'read_window'
        timeout-minutes: 30
        run: |
          # The existing program has fixed, bounded in-memory inputs and no data paths.
          echo "## Read Window Benchmark" >> "$BENCH_RESULTS_DIR/summary.md"
          cargo +1.90 run --locked --release -p read_window_test \
            2>&1 | tee "$BENCH_RESULTS_DIR/read-window.txt"
          cat "$BENCH_RESULTS_DIR/read-window.txt" >> "$BENCH_RESULTS_DIR/summary.md"

      - name: Run general benchmark
        if: inputs.benchmark_type == 'all' || inputs.benchmark_type == 'benchmark'
        run: |
          echo "## General Benchmark" >> "$BENCH_RESULTS_DIR/summary.md"
          START_TIME=$(date +%s)
          cargo +1.90 run --locked --release -p benchmark -- \
            --operations 30000000 \
            --writes 10000000 \
            --write-threads 72 \
            --mixed-threads 72 \
            --write-size 512 \
            --key-len 32 \
            --path "$BENCH_DATA_DIR/general" \
            2>&1 | tee "$BENCH_RESULTS_DIR/benchmark.txt"
          cat "$BENCH_RESULTS_DIR/benchmark.txt" >> "$BENCH_RESULTS_DIR/summary.md"
          echo "Total time: $(($(date +%s) - START_TIME)) seconds" >> "$BENCH_RESULTS_DIR/summary.md"

      - name: Run general benchmark (4K values, Zipf=2.0, 100% reads)
        if: inputs.benchmark_type == 'all' || inputs.benchmark_type == 'benchmark'
        run: |
          echo "## General Benchmark (4K Values, Zipf=2.0, 100% Reads)" >> "$BENCH_RESULTS_DIR/summary.md"
          START_TIME=$(date +%s)
          cargo +1.90 run --locked --release -p benchmark -- \
            --parameters-path .github/benchmark-config-4k-zipf2.yml \
            --path "$BENCH_DATA_DIR/general-4k" \
            2>&1 | tee "$BENCH_RESULTS_DIR/benchmark-4k-zipf2.txt"
          cat "$BENCH_RESULTS_DIR/benchmark-4k-zipf2.txt" >> "$BENCH_RESULTS_DIR/summary.md"
          echo "Total time: $(($(date +%s) - START_TIME)) seconds" >> "$BENCH_RESULTS_DIR/summary.md"

      - name: Create condensed summary for Slack
        if: inputs.post_to_slack
        id: condensed_summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          results = Path(os.environ["BENCH_RESULTS_DIR"])
          lines = ["# Native Benchmark Summary", f"Commit: {os.environ['GITHUB_SHA']}"]
          for name in ("index", "read-window", "benchmark", "benchmark-4k-zipf2"):
              path = results / f"{name}.txt"
              if path.exists():
                  lines.append(f"\n{name}:")
                  lines.extend(line for line in path.read_text().splitlines() if any(
                      marker in line for marker in (
                          "End-to-end throughput:", "Write test done", "Mixed test done",
                          "Latency(mcs): p50:", "Read test done", "hit rate",
                      )
                  ))
          summary = "\n".join(lines)
          (results / "slack_summary.md").write_text(summary + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("summary=" + json.dumps(summary) + "\n")
          PY

      - name: Send to Slack
        if: inputs.post_to_slack
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          channel-id: "tidehunter"
          payload: |
            {
              "text": "Native Benchmark Results",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ steps.condensed_summary.outputs.summary }}
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full results>"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Upload benchmark results and failure logs
        if: always() && steps.prepare.outputs.owned == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCH_RESULTS_DIR }}/
          if-no-files-found: warn
          retention-days: 20

      - name: Remove only this run's owned benchmark data
        if: always() && steps.prepare.outputs.owned == 'true'
        run: |
          test "$BENCH_DATA_DIR" = "$BENCH_RUN_DIR/data"
          test ! -L "$BENCH_RUN_DIR"
          rm -rf -- "$BENCH_DATA_DIR"
