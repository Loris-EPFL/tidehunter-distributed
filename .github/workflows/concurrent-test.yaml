name: Concurrent Test

on:
  push:
    branches: [main, master, feat/sharded-value-wal]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  concurrent-test:
    name: Run Concurrent Test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up repository Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7
        with:
          toolchain: "1.90"

      - name: Cache Cargo dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-deps-${{ hashFiles('Cargo.lock') }}

      - name: Cache concurrent build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.90-concurrent-release-default-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'rust-toolchain.toml', '.cargo/**', '.github/scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.90-concurrent-release-default-${{ hashFiles('Cargo.lock') }}-

      - name: Prepare native dependencies
        run: bash .github/scripts/setup.sh core

      - name: Run concurrent test
        run: cargo +1.90 run --locked -p concurrent_test --release
        timeout-minutes: 20