global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
scrape_configs:
  - job_name: comparison
    sample_limit: 100000
    label_limit: 16
    label_name_length_limit: 128
    label_value_length_limit: 256
    body_size_limit: 8MB
    file_sd_configs:
      - files: [/etc/prometheus/targets/comparison.json]
        refresh_interval: 5s
  - job_name: host
    sample_limit: 10000
    file_sd_configs:
      - files: [/etc/prometheus/targets/host.json]
        refresh_interval: 5s
  - job_name: native-benchmark
    sample_limit: 100000
    label_limit: 32
    label_value_length_limit: 256
    body_size_limit: 16MB
    file_sd_configs:
      - files: [/etc/prometheus/targets/native.json]
        refresh_interval: 5s
  - job_name: sui-typed-store
    sample_limit: 200000
    label_limit: 32
    label_value_length_limit: 256
    body_size_limit: 32MB
    file_sd_configs:
      - files: [/etc/prometheus/targets/sui.json]
        refresh_interval: 5s
