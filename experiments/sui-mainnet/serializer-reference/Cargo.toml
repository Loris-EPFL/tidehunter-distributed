[package]
name = "sui-mainnet-serializer-reference"
version = "0.1.0"
edition = "2021"
publish = false

# Test-only oracle. These pinned serializers already underpin the inspected Sui
# schemas; no Sui crate/build or runtime generator dependency is introduced.
[workspace]

[dependencies]
bcs = "=0.1.6"
bincode = "=1.3.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
